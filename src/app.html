<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Stealth POC: remove when launching publicly (see static/robots.txt). -->
		<meta name="robots" content="noindex, nofollow" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
		<link rel="shortcut icon" href="/favicon/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="LegalSpotter" />
		<link rel="manifest" href="/favicon/site.webmanifest" />
		<script>
			// Applies the saved theme before first paint so the page never flashes the wrong one.
			try {
				var saved = localStorage.getItem('theme');
				// Light or dark if chosen; anything else (nothing saved, or "system") follows the device.
				var light = saved === 'light' || (saved !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
				document.documentElement.dataset.theme = light ? 'light' : 'dark';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
