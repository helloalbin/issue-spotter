<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Stealth POC: remove when launching publicly (see static/robots.txt). -->
		<meta name="robots" content="noindex, nofollow" />
		<meta name="text-scale" content="scale" />
		<script>
			// Applies the saved theme before first paint so the page never flashes the wrong one.
			try {
				var saved = localStorage.getItem('theme');
				var light = saved ? saved === 'light' : matchMedia('(prefers-color-scheme: light)').matches;
				document.documentElement.dataset.theme = light ? 'light' : 'dark';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
